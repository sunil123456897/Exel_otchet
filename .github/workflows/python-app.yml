name: Python QA

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Create virtual environment
        run: |
          python -m venv .venv
          .venv\Scripts\python -m pip install --upgrade pip

      - name: Install dependencies
        run: |
          .venv\Scripts\pip install -r requirements.txt
          .venv\Scripts\pip install ruff mypy pytest

      # ── ruff (check only) ──────────────────────────────────────
      - name: ruff — lint check
        run: .venv\Scripts\python -m ruff check APP tests

      # ── mypy (baseline mode: block only NEW errors) ────────────
      - name: mypy — strict baseline check
        run: |
          python -c "
          import subprocess, sys

          result = subprocess.run(
              ['.venv\\Scripts\\python', '-m', 'mypy', 'APP',
               '--ignore-missing-imports', '--strict', '--no-error-summary'],
              capture_output=True, text=True, cwd='${{ github.workspace }}'
          )
          err_lines = sorted(result.stderr.splitlines())

          baseline_path = '.mypy_baseline.txt'
          new_errors = []
          try:
              with open(baseline_path) as f:
                  baseline = set(line.strip() for line in f if line.strip())
          except FileNotFoundError:
              print(f'::warning::No baseline file — treating all {len(err_lines)} errors as pre-existing')
              with open(baseline_path, 'w') as f:
                  f.write(result.stderr)
              sys.exit(0)

          for line in err_lines:
              if line.strip() and line.strip() not in baseline:
                  new_errors.append(line)

          if new_errors:
              print(f'::error::{len(new_errors)} NEW mypy errors detected!')
              for e in new_errors[:20]:
                  print(f'  {e}')
              sys.exit(1)
          else:
              print(f'mypy OK: {len(err_lines)} total, 0 new (baseline: {len(baseline)})')
          "

      # ── pytest (skipped on runtime-only branches without tests/) ─
      - name: pytest
        shell: pwsh
        env:
          PYTHONPATH: ${{ github.workspace }}\APP
        run: |
          if (Test-Path tests) {
            .venv\Scripts\python -m pytest tests/ -q --tb=short -p no:cacheprovider
          } else {
            Write-Host "tests/ not present in this branch — skipping pytest"
          }

      - name: Upload test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: |
            APP/startup_log.txt
            APP/gui_error_log.txt
          if-no-files-found: ignore
