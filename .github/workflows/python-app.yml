name: Python QA

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Create virtual environment
        run: |
          python -m venv .venv
          .venv\Scripts\python -m pip install --upgrade pip

      - name: Install dependencies
        run: |
          .venv\Scripts\pip install -r requirements.txt
          .venv\Scripts\pip install -r requirements-dev.txt

      # ── ruff (check only) ──────────────────────────────────────
      - name: ruff — lint check
        run: .venv\Scripts\python -m ruff check APP tests

      # ── mypy (baseline mode: block only NEW errors) ────────────
      # NOTE: mypy writes its findings to **stdout**, with stderr reserved for
      # tool crashes. The previous inline check read only stderr and was a
      # silent no-op. We now use tools/ci_mypy_check.py, which reads stdout,
      # normalizes path/line numbers so row shifts are not mistaken for new
      # findings, and compares against .mypy_baseline.txt.
      - name: mypy — strict baseline check (block new errors only)
        run: >
          .venv\Scripts\python tools\ci_mypy_check.py
          --repo-root .
          --python .venv\Scripts\python.exe
          --baseline .mypy_baseline.txt

      # ── pytest ─────────────────────────────────────────────────
      # MR-0005: tests/ MUST be present in any branch that ships runtime code.
      # A green build that skipped pytest because tests/ was missing would let
      # unverified runtime code reach production. We fail the job instead of
      # silently skipping. The only legitimate reason to ship without tests/
      # is a dedicated distribution branch, which sets RUNTIME_ONLY_DIST=1.
      - name: pytest
        shell: pwsh
        env:
          PYTHONPATH: ${{ github.workspace }}\APP
        run: |
          if (-not (Test-Path tests)) {
            if ($env:RUNTIME_ONLY_DIST -eq '1') {
              Write-Host "::notice::tests/ absent and RUNTIME_ONLY_DIST=1 — pytest intentionally skipped on distribution branch."
            } else {
              Write-Host "::error::tests/ not present in this branch. Ship-ready code MUST be exercised by the test suite. If this is a dedicated distribution branch, set RUNTIME_ONLY_DIST=1."
              exit 1
            }
          } else {
            .venv\Scripts\python -m pytest tests/ -q --tb=short -p no:cacheprovider
          }

      - name: Upload test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: |
            APP/startup_log.txt
            APP/gui_error_log.txt
          if-no-files-found: ignore
