  <text x="670" y="332" text-anchor="middle" fill="#c4b5fd" font-size="10">python-calamine • 50x faster</text>
  <text x="670" y="347" text-anchor="middle" fill="#c4b5fd" font-size="10">CalamineReader → ingestion_core.py</text>

