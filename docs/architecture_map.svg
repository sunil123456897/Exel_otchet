  <text x="700" y="62" text-anchor="middle" fill="#94a3b8" font-size="12">805 узлов • 2168 связей • 48 кластеров • 62 execution flow</text>

  <!-- ===== LAYER 1: UI (Top) ===== -->
  <rect x="350" y="85" width="700" height="130" rx="10" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="700" y="108" text-anchor="middle" fill="#60a5fa" font-size="13" font-weight="600">🖥️ PRESENTATION LAYER (UI)</text>

  <!-- GuiMaster -->
