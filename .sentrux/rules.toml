[constraints]
max_cycles = 0
max_coupling = "B"
max_cc = 25
no_god_files = true

[[layers]]
name = "bootstrap"
paths = ["APP/core/bootstrap.py"]
order = 0

[[layers]]
name = "ui"
paths = ["APP/core/ui/**"]
order = 1

[[layers]]
name = "view_models"
paths = ["APP/core/view_models/**"]
order = 2

[[layers]]
name = "app_controller"
paths = ["APP/core/app_controller.py"]
order = 3

[[layers]]
name = "app"
paths = ["APP/core/app/**"]
order = 4

[[layers]]
name = "infra"
paths = ["APP/core/infra/**"]
order = 5

[[layers]]
name = "domain"
paths = ["APP/core/domain/**"]
order = 6

[[boundaries]]
from = "APP/core/domain/**"
to = "APP/core/infra/**"
reason = "Domain must not depend on infrastructure"

[[boundaries]]
from = "APP/core/domain/**"
to = "APP/core/ui/**"
reason = "Domain must stay independent from UI"

[[boundaries]]
from = "APP/core/view_models/**"
to = "APP/core/infra/**"
reason = "View models should depend on controller/app abstractions, not infra"

[[boundaries]]
from = "APP/core/domain/**"
to = "APP/core/app/**"
reason = "Domain should not depend on app orchestration"

[[boundaries]]
from = "APP/core/domain/**"
to = "APP/core/app_controller.py"
reason = "Domain should not import app controller"

[[boundaries]]
from = "APP/core/domain/**"
to = "APP/core/view_models/**"
reason = "Domain should not depend on view models"

[[boundaries]]
from = "APP/core/infra/**"
to = "APP/core/ui/**"
reason = "Infrastructure must not import UI"

[[boundaries]]
from = "APP/core/infra/**"
to = "APP/core/view_models/**"
reason = "Infrastructure must not import view models"

[[boundaries]]
from = "APP/core/app/**"
to = "APP/core/ui/**"
reason = "App services must stay UI-agnostic"

[[boundaries]]
from = "APP/core/app/**"
to = "APP/core/view_models/**"
reason = "App services must not depend on view models"

[[boundaries]]
from = "APP/core/ui/**"
to = "APP/core/domain/**"
reason = "UI should not import domain internals directly"

[[boundaries]]
from = "APP/core/app_controller.py"
to = "APP/core/ui/**"
reason = "App controller must stay UI-agnostic"

[[boundaries]]
from = "APP/core/app_controller.py"
to = "APP/core/view_models/**"
reason = "App controller must not depend on view models"

[[boundaries]]
from = "APP/core/bootstrap.py"
to = "APP/core/ui/**"
reason = "Bootstrap should compose dependencies, not depend on UI widgets"
