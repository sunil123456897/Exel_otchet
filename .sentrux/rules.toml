[architecture]
layers = [
    "APP/src/backend",
    "APP/src/frontend",
    "APP/src"
]

[analysis]
ignore = [
    "**/__pycache__/**",
    "**/*.db",
    "**/*.xlsx",
    "**/*.xlsb",
    "**/*.log",
    "**/*.txt",
    "**/perf_test_data/**",
    "**/tests/**",
    "**/temp_destructive_env/**",
    "**/REPORTS/**",
    "**/Старое/**"
]

[[rules]]
name = "Frontend should not depend on DB logic"
from = "APP/src/frontend"
to = "APP/src/backend/persistence_manager"
allowed = false
