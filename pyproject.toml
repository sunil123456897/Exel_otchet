[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [
    ".git",
    ".pytest_cache",
    ".ruff_cache",
    "tmp_*",
    "output",
    "APP/output",
]

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E402", "E501", "E701"]

[tool.ruff.lint.per-file-ignores]
"APP/core/domain/__init__.py" = ["F401"]
"APP/core/infra/__init__.py" = ["F401"]
"tests/*" = ["E501", "E701", "E712", "E722", "E741", "F401", "F541", "F811", "F841"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
no_implicit_optional = false
check_untyped_defs = false
exclude = "(?x)(^tmp_.*|^output/|^APP/output/)"
disable_error_code = [
    "arg-type",
    "assignment",
    "attr-defined",
    "index",
    "operator",
    "return-value",
    "union-attr",
    "var-annotated",
]

[[tool.mypy.overrides]]
module = ["tests.*", "performance_benchmark", "stress_test_new"]
ignore_errors = true

[tool.pytest.ini_options]
addopts = "-p no:cacheprovider"
testpaths = ["tests"]
pythonpath = ["APP"]
