# Minimal dev config for the runtime-only main branch.
# Full pytest config and tests-specific ignores live in the experiments branch.

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [
    ".git",
    ".pytest_cache",
    ".ruff_cache",
    "tmp_*",
    "output",
    "APP/output",
]

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E402", "E501", "E701"]

[tool.ruff.lint.per-file-ignores]
"APP/core/domain/__init__.py" = ["F401"]
"APP/core/infra/__init__.py" = ["F401"]

[tool.pytest.ini_options]
addopts = "-p no:cacheprovider"
testpaths = ["tests"]
# APP — runtime package path; tools — repo-level QA scripts used by tests
# (compare_workbooks.py, qa_baseline.py, ci_mypy_check.py);
# tests/golden — synthetic fixture builders shared across golden tests.
pythonpath = ["APP", "tools", "tests/golden"]
# e2e: end-to-end scenarios that require the operator's real data files
# (рсч всех/, REPORTS/Отчет кураторов N/). Skipped automatically when those
# dirs are absent (CI, clean checkout). Run explicitly: pytest --run-e2e.
markers = [
    "e2e: end-to-end on real customer data; skipped unless data present / --run-e2e",
]
