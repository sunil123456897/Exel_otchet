database:
  isolation_level: EXCLUSIVE
  path: cache.db
  schema_path: db_schema.sql
  timeout: 30.0
  use_wal: true
locking:
  retry_backoff: 2.0
  retry_count: 5
  use_semaphores: true
network:
  drive_letters:
    - Q
    - Z
logic:
  commission_is_percent: true
  income_overrides:
    - доп
    - доп сф
    - '% посред'
  return_keywords:
    - возврат
paths:
  archive_dir: ../backups
  master_file: Master_Report.xlsx
  source_roots:
    - Q:/Отчет кураторов 1
    - Q:/Отчет кураторов 2
    - Q:/Отчет кураторов 3
sh1:
  markers:
    amount: сумма платежа
    broker1: посредник 1(кэш)
    broker2: посредник 2
    commission: комиссия
    contractor: Исполнитель
    customer: Заказчик
    expense: расход
    filters: фильтры
    income: приход
    percent_broker: '% посредника'
    total: итог
sh2: {}
