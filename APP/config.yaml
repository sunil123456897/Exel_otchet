database:
  path: cache.db
  schema_path: db_schema.sql
  timeout: 30.0
  allow_local_fallback: false
  isolation_level: EXCLUSIVE
  use_wal: true
locking:
  retry_count: 5
  retry_backoff: 2.0
  use_semaphores: true
network:
  drive_letters:
    - Q
    - Z
logic:
  commission_is_percent: true
  income_overrides:
    - доп
    - доп сф
    - '% посред'
  return_keywords:
    - возврат
paths:
  master_file: ../Master_Report.xlsx
  source_root: Q:\Отчет кураторов 1
  source_roots:
    - Q:\Отчет кураторов 1
    - Q:\Отчет кураторов 2
    - Q:\Отчет кураторов 3
  archive_dir: ../backups
sh1:
  markers:
    amount: сумма платежа
    broker1: посредник 1(кэш)
    broker2: посредник 2
    commission: комиссия
    contractor: Исполнитель
    currency: валюта
    currency_amount: сумма
    exchange_rate: курс
    customer: Заказчик
    expense: расход
    filters: фильтры
    income: приход
    percent_broker: '% посредника'
    transit_obligation: отправка транзитных обязательств
    total: итог
sh2: {}
curators:
  boris:
    enabled: true
    output_path: output/boris_report.xlsx
    intermediary2_rate: 0.05
    employees_key: борис
    direct_paths: []
    headers:
      - Источник
      - ЗАКАЗЧИК
      - ИСПОЛНИТЕЛЬ
      - Приход
      - Расход
      - Комиссия
      - ИТОГ
      - '% посредник 1'
      - посредник 1(кэш)
      - '% посредник 2'
      - посредник 2
      - Фильтры
  ivan:
    enabled: true
    output_path: output/ivan_report.xlsx
    intermediary1_rate: 0.05
    intermediary2_rate: 0.05
    employees_key: иван
    direct_paths: []
    headers:
      - Сотрудник
      - ЗАКАЗЧИК
      - ИСПОЛНИТЕЛЬ
      - Приход
      - Расход
      - Комиссия
      - ИТОГ
      - ОТПРАВКА ТРАНЗИТНЫХ ОБЯЗАТЕЛЬСТВ
      - '% посредника 1'
      - посредник 1(кэш)
      - посредник 2
      - курс
      - сумма
      - валюта
      - фильтры
validation: {}
rsch:
  recent_sources:
    - ../рсч всех/!!РСЧ Ханде.xlsx
    - ../рсч всех/!РСЧ Адам.xlsx
    - ../рсч всех/!РСЧ_Алина.xlsx
    - ../рсч всех/РСЧ Антон.xlsx
    - ../рсч всех/РСЧ дядя Розетта.xlsx
    - ../рсч всех/РСЧ Моника.xlsx
  last_output_dir: ../РСЧ
  mode: combined

performance:
  isolate_calamine: true
  max_workers:
backup:
  excel_keep: 10
