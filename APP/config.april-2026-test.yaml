database:
  isolation_level: EXCLUSIVE
  path: cache.april-2026-test.db
  schema_path: db_schema.sql
  timeout: 30.0
  use_wal: true
locking:
  retry_backoff: 2.0
  retry_count: 5
  use_semaphores: true
network:
  drive_letters:
    - Q
    - Z
logic:
  commission_is_percent: true
  income_overrides:
    - доп
    - доп сф
    - '% посред'
  return_keywords:
    - возврат
paths:
  archive_dir: ../backups
  master_file: output/Master_Report_april_2026_test.xlsx
  source_roots:
    - E:/Dlia Dashi/Version5/REPORTS/Отчет кураторов 1
    - E:/Dlia Dashi/Version5/REPORTS/Отчет кураторов 2
    - E:/Dlia Dashi/Version5/REPORTS/Отчет кураторов 3
sh1:
  markers:
    amount: сумма платежа
    broker1: посредник 1(кэш)
    broker2: посредник 2
    commission: комиссия
    contractor: Исполнитель
    customer: Заказчик
    expense: расход
    filters: фильтры
    income: приход
    percent_broker: '% посредника'
    total: итог
sh2: {}
curators:
  boris:
    enabled: true
    output_path: output/boris_report.xlsx
    intermediary2_rate: 0.05
    employees_key: борис
    direct_paths: []
    headers:
      - Дата
      - Источник
      - ЗАКАЗЧИК
      - ИСПОЛНИТЕЛЬ
      - Приход
      - Расход
      - Комиссия
      - ИТОГ
      - '% посредник 1'
      - посредник 1(кэш)
      - '% посредник 2'
      - посредник 2
      - Фильтры
  ivan:
    enabled: true
    output_path: output/ivan_report.xlsx
    intermediary1_rate: 0.05
    intermediary2_rate: 0.05
    employees_key: иван
    direct_paths: []
    headers:
      - Заказчик (название проекта, наименование ЮЛ)
      - Исполнитель (наименование ЮЛ, банк)
      - Сумма платежа
      - Комиссия
      - Итог
      - '%'
      - Комиссия посредника 1
      - '% посредник 2'
      - Комиссия посредника 2
      - Фильтр
