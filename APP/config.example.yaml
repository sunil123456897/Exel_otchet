# Copy this file to APP/config.yaml and adjust paths for the workstation.
# Prefer relative app-local paths for database files so the project can move
# between PCs without keeping stale E:\... paths.

database:
  path: cache.db
  schema_path: db_schema.sql
  timeout: 30.0
  allow_local_fallback: false
  isolation_level: EXCLUSIVE
  use_wal: true

locking:
  retry_count: 5
  retry_backoff: 2.0
  use_semaphores: true

network:
  drive_letters:
    - Q
    - Z

logic:
  commission_is_percent: true
  income_overrides:
    - доп
    - доп сф
    - "% посред"
  return_keywords:
    - возврат

paths:
  master_file: ../Master_Report.xlsx
  source_roots:
    - Q:\Отчет кураторов 1
    - Q:\Отчет кураторов 2
    - Q:\Отчет кураторов 3
  archive_dir: ../backups

curators:
  boris:
    enabled: true
    output_path: output/boris_report.xlsx
    employees_key: борис
    direct_paths: []
  ivan:
    enabled: true
    output_path: output/ivan_report.xlsx
    employees_key: иван
    direct_paths: []

rsch:
  recent_sources: []
  last_output_dir: ../РСЧ
  mode: combined

sh1:
  markers:
    source: Источник
    amount: сумма платежа
    broker1: посредник 1(кэш)
    broker2: посредник 2
    commission: комиссия
    contractor: Исполнитель
    currency: валюта
    currency_amount: сумма
    exchange_rate: курс
    customer: Заказчик
    expense: расход
    filters: фильтры
    income: приход
    percent_broker: "% посредника"
    transit_obligation: отправка транзитных обязательств
    total: итог

sh2: {}
validation: {}
